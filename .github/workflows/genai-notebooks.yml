# Executes src/setup/a_ollama_setup.ipynb and the notebooks in src/gen_ai/ top
# to bottom against local language models served by Ollama on the runner, so
# the GenAI half of the course is proven to run too. Any cell error fails the
# notebook's job. The workflow uses no credentials and calls no hosted model: there is no
# .env on the runner and no secret is passed in, so every optional Azure/OpenAI
# cell takes its "skipped / no credentials" branch.
#
# Why a separate workflow from notebooks.yml: each job needs an Ollama server
# and about 5 GB of model weights, and the model calls run on a CPU-only runner.
# It runs weekly, on demand, and on pushes to main that touch the GenAI
# notebooks, rather than on every push and pull request.
#
# Which notebooks run (tools/select_notebooks.py): on a push, only those whose
# code changed since the push's previous commit, meaning a code cell added,
# removed, reordered or edited; markdown and stored outputs do not count. The
# weekly and manual runs, a push whose previous commit is unknown, and a push
# that changes pyproject.toml, uv.lock or this file run them all. Each selected
# notebook gets its own job, and the jobs run in parallel. That works because
# the notebooks are independent: each one sets its own experiment, and
# f_genai_app_serving registers the `qa-answer` prompt itself when
# e_prompt_registry has not run first.
#
# Models, exactly the ones the track documents (src/setup/a_ollama_setup.ipynb):
#   gemma3:4b         chat model and LLM judge for most notebooks (3.3 GB)
#   qwen3:1.7b        tool-calling model for d_langchain_agent (1.4 GB)
#   nomic-embed-text  embedding model for i_rag_capstone (0.3 GB)
# Ollama is installed with its official Linux script at a pinned version
# (OLLAMA_VERSION; bump it deliberately) and runs as `ollama serve` on 11434. The
# model directory is cached with actions/cache, keyed on the model list; every
# run still calls `ollama pull`, which only checks the registry when the
# weights are already there.
#
# Ports, as the notebooks hard-code them:
#   11434  Ollama
#   5001   tracking server for src/gen_ai/ (src/setup/ uses none)
#   5002   model server. f_genai_app_serving and i_rag_capstone each start
#          `mlflow models serve` themselves and stop it at the end, so the
#          workflow starts nothing on 5002. Each runs on its own runner, where
#          the port is free.
#
# Each notebook runs with its own directory as the working directory, as a
# reader runs it. The tracking server runs from $RUNNER_TEMP, so its mlflow.db
# and mlartifacts/ stay out of the checkout. Executed copies are written to
# $RUNNER_TEMP too; the tracked notebooks are never overwritten. f_ writes the
# gitignored file src/gen_ai/_genai_app.py, and i_ writes src/gen_ai/_rag_app.py
# and src/gen_ai/milvus_rag.db, as they do for a reader.
#
# Timing: GitHub-hosted runners have no GPU, so every model call runs on 4 CPU
# cores, one at a time (the notebooks run judges serially). Each job spends
# about 6 minutes on setup, mostly restoring the cached models. Executing a
# notebook took 0-16 minutes in the 2026-10-31 run: i_ 16, e_ 7, c_ and h_ 4,
# g_ 3, the rest 1 or less. With every notebook selected, the workflow takes
# about as long as the i_ job, roughly 25 minutes. A single cell can take
# several minutes, hence the generous per-cell timeout. A failing notebook
# fails only its own job; the final job reports whether all of them passed.

name: GenAI notebooks

on:
  push:
    branches: [main]
    paths:
      - "src/gen_ai/**"
      - "src/setup/**"
      - ".github/workflows/genai-notebooks.yml"
      # A dependency change can break the GenAI notebooks without touching them.
      - "pyproject.toml"
      - "uv.lock"
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    name: Select the notebooks whose code changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      notebooks: ${{ steps.select.outputs.notebooks }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The checkout holds only the tested commit; fetch the push's previous
      # commit to diff against. If it cannot be fetched, every notebook runs.
      - name: Select notebooks
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.before }}
        run: |
          args=()
          if [ "$EVENT" != push ]; then args+=(--all); fi
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
            git fetch --no-tags --depth=1 origin "$BASE" || echo "Could not fetch the base commit $BASE"
          fi
          selected=$(python3 tools/select_notebooks.py "${args[@]}" --base "$BASE" --head HEAD \
            --always pyproject.toml --always uv.lock --always .github/workflows/genai-notebooks.yml \
            src/setup src/gen_ai)
          echo "notebooks=$selected" >> "$GITHUB_OUTPUT"

  execute:
    name: ${{ matrix.notebook }}
    needs: select
    if: ${{ needs.select.outputs.notebooks != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        notebook: ${{ fromJSON(needs.select.outputs.notebooks) }}
    env:
      # Seconds a single cell may run. The longest cells call the local judge
      # 15-20 times in a row on CPU (e_prompt_registry, i_rag_capstone).
      CELL_TIMEOUT: "3600"
      # CPU runners vary a lot in speed. MLflow's defaults are tuned for GPUs or
      # hosted models: the model server cuts a request off after 60 s (f_ asks it
      # two questions per request), and an evaluation gives up on a prediction or
      # judge call after 300 s. The served app inherits these from the job env.
      MLFLOW_SCORING_SERVER_REQUEST_TIMEOUT: "900"
      MLFLOW_GENAI_EVAL_ASYNC_TIMEOUT: "1800"
      # Pinned so a new Ollama release cannot change model behaviour unnoticed.
      OLLAMA_VERSION: "0.34.0"
      # Space-separated; also the cache key, so editing it re-downloads.
      OLLAMA_PULL_MODELS: "gemma3:4b qwen3:1.7b nomic-embed-text"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The hosted-model cells only run when AZURE_OPENAI_* or OPENAI_API_KEY
      # are set, from the environment or a .env file. Make sure neither exists.
      - name: Check that no model credentials are present
        run: |
          if [ -e .env ]; then
            echo "A .env file is present; this workflow must run without one"
            exit 1
          fi
          if env | grep -Eq '^(AZURE_OPENAI_[A-Z_]*|AZURE_API_[A-Z_]*|OPENAI_API_KEY)='; then
            echo "Model credentials are set in the environment"
            exit 1
          fi
          echo "No .env file and no model credentials: hosted-model cells will be skipped"

      # Ollama (about 4 GB unpacked), the models, the actions/cache archive of
      # them and the virtual environment need more room than the runner keeps
      # free. The Android SDK and .NET are unused here.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          df -h /

      - name: Install Python 3.14
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # --group azure installs the optional hosted-model packages, so the lockfile's
      # Azure group is proven to install. No notebook calls Azure: the workflow
      # sets no credentials, and the hosted swaps are commented or guarded.
      - name: Install dependencies from uv.lock
        run: |
          uv sync --locked --group azure
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # The official script also registers and starts a systemd service that
      # runs as the ollama user with its models under /usr/share/ollama. Stop
      # and disable it, so the server the notebooks reach is the one started
      # below as the runner user, with its models in ~/.ollama/models, a
      # directory actions/cache can restore and save without sudo.
      - name: Install Ollama ${{ env.OLLAMA_VERSION }}
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl disable --now ollama

      - name: Compute the model cache key
        id: models
        run: |
          echo "key=ollama-models-${RUNNER_OS}-$(echo "$OLLAMA_PULL_MODELS" | tr ' :' '-_')" >> "$GITHUB_OUTPUT"

      # Restore and save are separate steps so the models are saved as soon as
      # they are pulled, even when a notebook fails later in the job.
      - name: Restore cached Ollama models
        id: cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.ollama/models
          key: ${{ steps.models.outputs.key }}

      # OLLAMA_CONTEXT_LENGTH matches the 4096-token context of the run that
      # produced the stored outputs. One request at a time keeps the KV cache
      # small, and models stay loaded between notebooks instead of unloading
      # after Ollama's default 5 idle minutes.
      - name: Start Ollama on 11434 and pull the models
        env:
          OLLAMA_CONTEXT_LENGTH: "4096"
          OLLAMA_NUM_PARALLEL: "1"
          OLLAMA_KEEP_ALIVE: "60m"
        run: |
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 60); do
            if curl -fsS http://127.0.0.1:11434/api/version > /dev/null 2>&1; then break; fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:11434/api/version; then
            cat "$RUNNER_TEMP/ollama.log"
            exit 1
          fi
          echo
          for model in $OLLAMA_PULL_MODELS; do
            ollama pull "$model"
          done
          ollama list
          du -sh ~/.ollama/models
          df -h /

      # On a cache miss every parallel job pulls the models and tries to save
      # them; the first save wins and the others only warn.
      - name: Save Ollama models to the cache
        if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.ollama/models
          key: ${{ steps.models.outputs.key }}

      # Load both chat models into memory once, so the first call in a
      # notebook does not spend its client timeout (300 s for model calls)
      # loading weights from disk.
      - name: Warm up the chat models
        run: |
          for model in gemma3:4b qwen3:1.7b; do
            curl -fsS http://127.0.0.1:11434/api/generate \
              -d "{\"model\": \"$model\", \"keep_alive\": \"60m\"}" > /dev/null
            echo "$model loaded"
          done
          ollama ps

      - name: Start MLflow tracking server on 5001 (gen_ai)
        run: |
          dir="$RUNNER_TEMP/mlflow-5001"
          mkdir -p "$dir"
          (cd "$dir" && nohup mlflow server --host 127.0.0.1 --port 5001 > server.log 2>&1 &)
          for _ in $(seq 120); do
            if curl -fsS http://127.0.0.1:5001/health > /dev/null 2>&1; then break; fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:5001/health > /dev/null; then
            cat "$dir/server.log"
            exit 1
          fi
          echo "MLflow tracking server is up on port 5001"

      - name: Execute ${{ matrix.notebook }}
        id: run
        env:
          NOTEBOOK: ${{ matrix.notebook }}
        run: |
          dir=$(dirname "$NOTEBOOK")
          nb=$(basename "$NOTEBOOK")
          echo "name=${nb%.ipynb}" >> "$GITHUB_OUTPUT"
          cd "$dir"
          jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout="$CELL_TIMEOUT" \
            --output-dir "$RUNNER_TEMP/executed" "$nb"

      # The executed copy holds every output, including per-row judge errors
      # that the job log does not show; keep it for a week to diagnose failures.
      - name: Upload the executed notebook
        if: ${{ !cancelled() && steps.run.outputs.name != '' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: executed-${{ steps.run.outputs.name }}
          path: ${{ runner.temp }}/executed/
          retention-days: 7
          if-no-files-found: warn

      - name: Show server logs
        if: failure()
        run: |
          ollama ps || true
          for log in "$RUNNER_TEMP/mlflow-5001/server.log" "$RUNNER_TEMP/ollama.log"; do
            if [ -f "$log" ]; then
              echo "===== $log"
              tail -n 200 "$log"
            fi
          done

  # One status for the whole workflow: passes when every selected notebook
  # passed, or when no notebook's code changed.
  result:
    name: All selected GenAI notebooks passed
    needs: [select, execute]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the notebook jobs
        env:
          SELECT: ${{ needs.select.result }}
          EXECUTE: ${{ needs.execute.result }}
        run: |
          echo "select: $SELECT, execute: $EXECUTE"
          [ "$SELECT" = success ] && { [ "$EXECUTE" = success ] || [ "$EXECUTE" = skipped ]; }
