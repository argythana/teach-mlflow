# Executes the notebooks in src/basics/ and src/ml/ top to bottom, so a push to
# main proves the offline half of the course still runs. Any cell error fails
# the job. The workflow uses no credentials of any kind.
#
# Only notebooks whose code changed are executed (tools/select_notebooks.py): a
# code cell added, removed, reordered or edited since the push's previous commit
# or the pull request's base. Markdown and stored outputs do not count, since
# re-running would test the same code. ml/f_model_registry.ipynb also runs
# whenever ml/g_model_serving.ipynb does, because the model server g_ talks to
# serves the alias f_ sets. Every notebook runs on a manual run, when the base
# commit is unknown, and when pyproject.toml, uv.lock or this file changed. When
# nothing is selected, the execute job is skipped.
#
# A separate lint job runs every hook in .pre-commit-config.yaml on all files
# with prek, with the tool versions pinned in uv.lock: ruff format and check on
# the notebooks' code cells and on tools/ and tests/, mypy in strict mode on
# tools/ and tests/ (configured under [tool.mypy] in pyproject.toml; the
# notebooks are not type-checked), mdformat on the Markdown docs, the notebook
# markdown wrapper, detect-private-key and the file checks. The gitleaks hook
# scans staged changes, which a CI checkout has none of, so the job skips it and
# runs the same gitleaks version over the full git history instead.
#
# A separate test job runs pytest on tests/, offline and with no models or
# servers. It tests tools/wrap_notebook_markdown.py, the pre-commit formatter
# for notebook markdown (idempotent; code cells and outputs untouched; no
# breaks inside code spans or links), and tools/select_notebooks.py. It checks the stored outputs of every
# notebook in src/, including the ones this workflow cannot execute: no error
# outputs, execution counts all empty or exactly 1..N in cell order, and no
# home-directory paths; tests/test_quoted_results.py checks that numbers the
# prose quotes from a stored run match that run's outputs.
#
# Ports, as the notebooks hard-code them:
#   5000  tracking server for src/basics/
#   5001  tracking server for src/ml/
#   5002  model server. src/ml/g_model_serving.ipynb expects `mlflow models
#         serve` to be running already (a reader starts it in a second
#         terminal), so this workflow starts it just before that notebook and
#         stops it right after. src/ml/j_capstone_end_to_end.ipynb starts and
#         stops its own model server on 5002, so the port must be free by then.
#
# Each notebook runs with its own directory as the working directory, as a
# reader runs it. The servers run from $RUNNER_TEMP, so their mlflow.db and
# mlartifacts/ stay out of the checkout. Executed copies are written to
# $RUNNER_TEMP too; the tracked notebooks are never overwritten.
#
# GitHub-hosted runners have no GPU: the device="cuda" run in
# src/ml/i_system_metrics.ipynb falls back to CPU with an XGBoost warning.
#
# Not executed here: every notebook in src/gen_ai/ and src/setup/. Each one
# calls a local language model through Ollama, so they run in the separate
# genai-notebooks.yml workflow, which installs Ollama and pulls the models
# (the test job here still checks their stored outputs):
#   src/gen_ai/a_tracing_quickstart.ipynb
#   src/gen_ai/b_tracing_a_multistep_app.ipynb
#   src/gen_ai/c_genai_evaluation.ipynb
#   src/gen_ai/d_langchain_agent.ipynb
#   src/gen_ai/e_prompt_registry.ipynb
#   src/gen_ai/f_genai_app_serving.ipynb
#   src/gen_ai/g_feedback_and_monitoring.ipynb
#   src/gen_ai/h_dspy_optimization.ipynb
#   src/gen_ai/i_rag_capstone.ipynb
#   src/setup/a_ollama_setup.ipynb

name: Notebooks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Pre-commit hooks and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      # The full history, so gitleaks can scan every commit.
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Python 3.14
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # --only-dev installs just the dev group (prek, ruff, mypy, mdformat,
      # pytest) from uv.lock, not the course's runtime dependencies. mypy needs
      # pytest, which the tests import.
      - name: Install the dev tools from uv.lock
        run: uv sync --locked --only-dev

      - name: Cache the pre-commit hook environments
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # UV_NO_SYNC keeps each hook's `uv run` on the dev-only environment above
      # instead of installing the course's dependencies. A hook that would
      # change a file fails the step and prints the diff.
      - name: Run every pre-commit hook on all files
        env:
          SKIP: gitleaks
          UV_NO_SYNC: "1"
        run: uv run prek run --all-files --show-diff-on-failure

      - name: Scan the full git history for secrets
        if: ${{ !cancelled() }}
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .

  test:
    name: Test the tools and stored notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Python 3.14
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # The tests need only the standard library and pytest, so --only-dev
      # installs just the dev group from uv.lock.
      - name: Run pytest
        run: uv run --locked --only-dev pytest

  select:
    name: Select the notebooks whose code changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      notebooks: ${{ steps.select.outputs.notebooks }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The checkout holds only the tested commit; fetch the base to diff against.
      # If it cannot be fetched, the selector runs every notebook.
      - name: Select notebooks
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          args=()
          if [ "$EVENT" = workflow_dispatch ]; then args+=(--all); fi
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
            git fetch --no-tags --depth=1 origin "$BASE" || echo "Could not fetch the base commit $BASE"
          fi
          selected=$(python3 tools/select_notebooks.py "${args[@]}" --base "$BASE" --head HEAD \
            --always pyproject.toml --always uv.lock --always .github/workflows/notebooks.yml \
            --requires g_model_serving.ipynb=f_model_registry.ipynb \
            src/basics src/ml)
          echo "notebooks=$selected" >> "$GITHUB_OUTPUT"

  execute:
    name: Execute basics and ml notebooks
    needs: select
    if: ${{ needs.select.outputs.notebooks != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Seconds a single cell may run; the XGBoost cells in ml/i_ are the slowest.
      CELL_TIMEOUT: "900"
      SELECTED: ${{ needs.select.outputs.notebooks }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Python 3.14
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # --group shap installs the optional shap group, so ml/e_model_evaluation's
      # SHAP branch runs here as it did for the outputs stored in the notebook.
      - name: Install dependencies from uv.lock
        run: |
          uv sync --locked --group shap
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # fetch_california_housing downloads its data on first use; caching it
      # avoids a network fetch (and its occasional failures) on every run.
      - name: Cache scikit-learn datasets
        uses: actions/cache@v6.1.0
        with:
          path: ~/scikit_learn_data
          key: scikit-learn-data-v1

      - name: Start MLflow tracking servers on 5000 (basics) and 5001 (ml)
        id: servers
        run: |
          for port in 5000 5001; do
            dir="$RUNNER_TEMP/mlflow-$port"
            mkdir -p "$dir"
            (cd "$dir" && nohup mlflow server --host 127.0.0.1 --port "$port" > server.log 2>&1 &)
          done
          for port in 5000 5001; do
            for _ in $(seq 120); do
              if curl -fsS "http://127.0.0.1:$port/health" > /dev/null 2>&1; then break; fi
              sleep 1
            done
            if ! curl -fsS "http://127.0.0.1:$port/health" > /dev/null; then
              cat "$RUNNER_TEMP/mlflow-$port/server.log"
              exit 1
            fi
            echo "MLflow tracking server is up on port $port"
          done

      - name: Execute the selected src/basics notebooks
        working-directory: src/basics
        run: |
          for nb in $(jq -r '.[] | select(startswith("src/basics/")) | ltrimstr("src/basics/")' <<< "$SELECTED"); do
            echo "==> src/basics/$nb"
            jupyter nbconvert --to notebook --execute \
              --ExecutePreprocessor.timeout="$CELL_TIMEOUT" \
              --output-dir "$RUNNER_TEMP/executed/basics" "$nb"
          done

      - name: Execute the selected src/ml notebooks
        if: ${{ !cancelled() && steps.servers.outcome == 'success' }}
        working-directory: src/ml
        run: |
          serve_log="$RUNNER_TEMP/model-serve.log"

          start_model_server() {
            # Serves the alias f_model_registry.ipynb sets. setsid gives the
            # server its own process group, so stopping it also stops uvicorn.
            MLFLOW_TRACKING_URI=http://127.0.0.1:5001 setsid mlflow models serve \
              -m "models:/ca_housing_price@champion" \
              --host 127.0.0.1 --port 5002 --env-manager local > "$serve_log" 2>&1 &
            serve_pgid=$!
            for _ in $(seq 120); do
              if curl -fsS http://127.0.0.1:5002/health > /dev/null 2>&1; then
                echo "Model server is up on port 5002"
                return 0
              fi
              sleep 1
            done
            cat "$serve_log"
            return 1
          }

          stop_model_server() {
            kill -TERM -- "-$serve_pgid" 2> /dev/null || true
            for _ in $(seq 30); do
              if ! ss -Hltn "sport = :5002" | grep -q .; then
                echo "Model server stopped; port 5002 is free"
                return 0
              fi
              sleep 1
            done
            echo "Port 5002 is still in use after stopping the model server"
            return 1
          }

          for nb in $(jq -r '.[] | select(startswith("src/ml/")) | ltrimstr("src/ml/")' <<< "$SELECTED"); do
            if [ "$nb" = g_model_serving.ipynb ]; then start_model_server; fi
            echo "==> src/ml/$nb"
            jupyter nbconvert --to notebook --execute \
              --ExecutePreprocessor.timeout="$CELL_TIMEOUT" \
              --output-dir "$RUNNER_TEMP/executed/ml" "$nb"
            if [ "$nb" = g_model_serving.ipynb ]; then stop_model_server; fi
          done

      - name: Show server logs
        if: failure()
        run: |
          for log in "$RUNNER_TEMP"/mlflow-500*/server.log "$RUNNER_TEMP/model-serve.log"; do
            if [ -f "$log" ]; then
              echo "===== $log"
              tail -n 200 "$log"
            fi
          done
