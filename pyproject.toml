[project]
name = "teach-mlflow"
version = "0.1.0"
description = "Tutorials and teaching material for MLflow, from beginner to advanced topics."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dspy>=3.2.1",
    "jupyter>=1.1.1",
    "langchain>=1.3.4",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.4",
    "llama-index-core>=0.14.22",
    "llama-index-embeddings-ollama>=0.10.0",
    "llama-index-llms-ollama>=0.11.0",
    "llama-index-vector-stores-milvus>=1.1.0",
    "matplotlib>=3.10.9",
    "mlflow>=3.12.0",
    "numpy>=2.4.4",
    "nvidia-ml-py>=13.610.43",
    "openai>=2.41.0",
    "optuna>=4.8.0",
    "pandas>=2.3.3",
    "pymilvus>=2.6.15",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "skops>=0.14.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
azure = [
    "llama-index-embeddings-azure-openai>=0.5.2",
    "llama-index-llms-azure-openai>=0.5.5",
]
dev = [
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    "mypy>=2.4.0",
    "prek>=0.5.3",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
# `ruff check .` and `ruff format --check .` cover the notebooks in src/ (ruff
# includes *.ipynb files by default) and the Python in tools/ and tests/. ruff infers
# the target Python version from requires-python. The pre-commit hooks in
# .pre-commit-config.yaml run `ruff format` and `ruff check --fix` on both.
line-length = 88

[tool.ruff.lint]
# ruff's default rule set: pycodestyle errors that do not conflict with a formatter
# (E4, E7, E9) and pyflakes (F); plus bugbear (B), comprehensions (C4), import order
# (I), pep8-naming (N), misc lints (PIE), pytest style (PT), pathlib (PTH), return
# statements (RET), ruff's own rules (RUF), simplifications (SIM) and pyupgrade (UP).
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "B",
    "C4",
    "I",
    "N",
    "PIE",
    "PT",
    "PTH",
    "RET",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
# Teaching notebooks favour the order a reader meets things over tool conventions:
# - E402, I001: a notebook may import a module next to the code that teaches it, or
#   set a warnings filter before the imports whose warnings it silences
#   (ml/h_dataset_logging, ml/j_capstone_end_to_end);
# - B905: zip() without strict= keeps the examples short;
# - PTH: notebooks use open() and os.path where readers expect them;
# - RUF001, RUF005, RUF007: typographic characters in printed prose, list
#   concatenation and zip(x, x[1:]) are written the way a beginner reads them.
"*.ipynb" = ["E402", "I001", "B905", "PTH", "RUF001", "RUF005", "RUF007"]

[tool.mypy]
# Type-checks the Python outside the notebooks: `mypy` with no arguments checks
# `files`. Strict mode, plus the optional error codes that catch dead or
# redundant code. The notebooks in src/ are teaching material and are not checked.
files = ["tools", "tests"]
strict = true
warn_unreachable = true
enable_error_code = [
    "deprecated",
    "explicit-override",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable",
]
