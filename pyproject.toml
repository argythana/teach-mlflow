[project]
name = "teach-mlflow"
version = "0.1.0"
description = "Tutorials and teaching material for MLflow, from beginner to advanced topics."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dspy>=3.2.1",
    "jupyter>=1.1.1",
    "langchain>=1.3.4",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.4",
    "llama-index-core>=0.14.22",
    "llama-index-embeddings-azure-openai>=0.5.2",
    "llama-index-embeddings-ollama>=0.10.0",
    "llama-index-llms-azure-openai>=0.5.5",
    "llama-index-llms-ollama>=0.11.0",
    "llama-index-vector-stores-milvus>=1.1.0",
    "matplotlib>=3.10.9",
    "mlflow>=3.12.0",
    "numpy>=2.4.4",
    "nvidia-ml-py>=13.610.43",
    "openai>=2.41.0",
    "optuna>=4.8.0",
    "pandas>=2.3.3",
    "pymilvus>=2.6.15",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "skops>=0.14.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "huggingface-hub>=1.17.0",
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    "prek>=0.5.3",
    "ruff>=0.16.7",
]

[tool.ruff]
# `ruff check src/` lints the notebooks: ruff includes *.ipynb files by default,
# and infers the target Python version from requires-python. The pre-commit hooks in
# .pre-commit-config.yaml run `ruff format` and `ruff check --fix` on notebook code cells.
line-length = 88

[tool.ruff.lint]
# ruff's default rule set, spelled out so readers can see what is checked:
# pycodestyle errors that do not conflict with a formatter (E4, E7, E9) and pyflakes (F).
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# E402 (module-level import not at top of cell): a teaching notebook may import a
# module next to the code that teaches it, or set a warnings filter before the
# imports whose warnings it silences (ml/h_dataset_logging, ml/j_capstone_end_to_end).
"*.ipynb" = ["E402"]
